
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: logshipper-sa
  namespace: logging
  annotations:
    # IRSA annotation: replace with your role ARN
    eks.amazonaws.com/role-arn: arn:aws:iam::<ACCOUNT_ID>:role/<ROLE_NAME>
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: logshipper
  namespace: logging
  labels:
    app: logshipper
spec:
  selector:
    matchLabels:
      app: logshipper
  template:
    metadata:
      labels:
        app: logshipper
    spec:
      serviceAccountName: logshipper-sa
      # Run on all nodes (tolerations optional)
      tolerations:
        - operator: "Exists"
      initContainers:
        - name: fix-permissions
          image: alpine:3.23.3
          command: ["sh", "-c", "chown -R 1000:1000 /var/log/agent-out"]
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: agent-out
              mountPath: /var/log/agent-out
      containers:
        - name: logshipper
          # Replace <IMAGE> with your built image
          image: "****:v1.0"
          imagePullPolicy: IfNotPresent
          # Run as root by default to allow reading host logs. Change if you secure mounts and drop privileges.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
          env:
            - name: CONTAINERS_DIR
              value: "/var/log/containers"
            - name: PODS_DIR
              value: "/var/log/pods"
            - name: TARGET_NS
              value: "ifsc-uat,las-prod"
            - name: S3_BUCKET
              value: "ifsc-eks-logs"
            - name: CLUSTER_NAME
              value: "cluster"
            - name: INTERVAL
              value: "60"
            - name: QUIET_WARN_MIN
              value: "10"
            - name: EXCLUDE_LIST
              value: "istio-proxy,istio-init,envoy,proxy,istio"
            - name: TMP_DIR
              value: "/var/log/agent-out"
            - name: APP_NAME
              value: "logshipper"
            - name: APP_VERSION
              value: "v1.0.0"
            - name: CLEANUP_DAYS
              value: "7"
            - name: WATCHDOG_ENABLED
              value: "true"
          # Readiness / Liveness endpoints (adjust path/port if your binary uses different)
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
          volumeMounts:
            - name: containers
              mountPath: /var/log/containers
              readOnly: true
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: agent-out
              mountPath: /var/log/agent-out
      # Volumes - hostPath mounts (agent-out uses DirectoryOrCreate)
      volumes:
        - name: containers
          hostPath:
            path: /var/log/containers
            type: Directory
        - name: pods
          hostPath:
            path: /var/log/pods
            type: Directory
        - name: agent-out
          hostPath:
            path: /var/log/agent-out
            type: DirectoryOrCreate
      # Optional: allow hostNetwork if you want agent to use host networking (not required)
      # hostNetwork: false

